# Generate release notes from merged PRs, grouped by labels (e.g. bug -> Bug Fix, enhancement -> Enhancement).
# Runs when a release is published and updates the release body.
name: Release notes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve previous tag
        id: prev_tag
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          PREV=$(git tag -l --sort=-version:refname | awk -v t="$TAG_NAME" 'prev==t{print; exit} {prev=$0}')
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV:-}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ steps.prev_tag.outputs.tag_name }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
        run: |
          chmod +x .github/scripts/generate-release-notes.sh
          .github/scripts/generate-release-notes.sh
